<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Roboto, Arial, sans-serif">
  <title>The Success Stack</title>
  <desc>On the left, a degree alone sits below a dashed hiring line, leaving a gap. On the right, the same degree with four blocks stacked on top of it (skills, projects, certifications and internships) rises past the line.</desc>

  <!-- The hiring line, drawn first so the stack passes in front of it -->
  <line x1="30" y1="210" x2="970" y2="210" stroke="#0e1014" stroke-width="5" stroke-dasharray="22 12"/>
  <text x="30" y="194" font-size="22" font-weight="800" letter-spacing="3" fill="#0e1014">THE HIRING LINE</text>

  <!-- Ground -->
  <rect x="30" y="500" width="940" height="4" fill="#0e1014"/>

  <!-- Left: a degree alone -->
  <rect x="130" y="394" width="240" height="102" rx="8" fill="#d8d2c4"/>
  <text x="250" y="456" text-anchor="middle" font-size="32" font-weight="700" fill="#0e1014">Degree</text>
  <line x1="250" y1="236" x2="250" y2="368" stroke="#5d626c" stroke-width="3"/>
  <polygon points="250,222 241,238 259,238" fill="#5d626c"/>
  <polygon points="250,382 241,366 259,366" fill="#5d626c"/>
  <text x="268" y="311" font-size="25" font-style="italic" fill="#4a4f58">the gap</text>
  <text x="250" y="548" text-anchor="middle" font-size="28" font-weight="700" fill="#353a43">Degree alone</text>

  <!-- Right: degree plus the four blocks -->
  <rect x="610" y="394" width="260" height="102" rx="8" fill="#d8d2c4"/>
  <text x="740" y="456" text-anchor="middle" font-size="32" font-weight="700" fill="#0e1014">Degree</text>
  <rect x="610" y="318" width="260" height="70" rx="8" fill="#00c08b"/>
  <text x="740" y="364" text-anchor="middle" font-size="29" font-weight="700" fill="#0e1014">Skills</text>
  <rect x="610" y="242" width="260" height="70" rx="8" fill="#ffb627"/>
  <text x="740" y="288" text-anchor="middle" font-size="29" font-weight="700" fill="#0e1014">Projects</text>
  <rect x="610" y="166" width="260" height="70" rx="8" fill="#9b6dff"/>
  <text x="740" y="212" text-anchor="middle" font-size="29" font-weight="700" fill="#0e1014">Certifications</text>
  <rect x="610" y="90" width="260" height="70" rx="8" fill="#ff5a3c"/>
  <text x="740" y="136" text-anchor="middle" font-size="29" font-weight="700" fill="#0e1014">Internships</text>
  <text x="740" y="66" text-anchor="middle" font-size="25" font-weight="700" fill="#0e1014">Clears the line &#10003;</text>
  <text x="740" y="548" text-anchor="middle" font-size="28" font-weight="700" fill="#353a43">Degree + your stack</text>
</svg>
